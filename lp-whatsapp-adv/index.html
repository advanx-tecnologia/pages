  <style>
    :root {

      --ink-soft: #171717;

      --copper: #b56a32;
      --copper-bright: #cc7a3b;
      --focus: #f6f1e8;
    }
    * { box-sizing: border-box; }
    html { background: var(--ink); }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(1000px 560px at 50% -12%, rgba(181, 106, 50, .22), transparent 68%),
        linear-gradient(180deg, #171717 0%, var(--ink) 100%);
      color: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; }
    .page {
      width: min(100% - 32px, 880px);
      min-height: 100dvh;
      margin: 0 auto;
      padding: clamp(24px, 5vw, 52px) 0 40px;
      display: grid;
      align-content: center;
      gap: clamp(28px, 5vw, 46px);
    }
    .brand {
      display: flex;

    }
    .brand img {

    .eyebrow {
      margin: 0 0 13px;

      font-weight: 780;
      letter-spacing: .13em;
      line-height: 1.25;
      text-transform: uppercase;
    }
    .audience {
      display: inline;
      color: var(--copper-bright);
      font-size: .64em;
      font-weight: 780;
      letter-spacing: .025em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    h1, p { margin: 0; }
    h1 {
      max-width: 19ch;
      margin-inline: auto;
      color: var(--paper);
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 680;
      letter-spacing: -.045em;
      line-height: 1.07;
      text-wrap: balance;
    }
    h1 strong { color: var(--copper-bright); font-weight: 720; }
    .lead {
      max-width: 560px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: clamp(16px, 2.2vw, 18px);
      line-height: 1.5;
      text-wrap: balance;
    }
    .video-shell {
      width: min(100%, 760px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #000;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .32);
    }
    .video-toggle {
      position: relative;
      display: block;
      width: 100%;
      min-height: 0;
      padding: 0;
      border: 0;
      background: #000;
      cursor: pointer;
      line-height: 0;
    }
    .video-toggle:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: min(68dvh, 596px);
      object-fit: contain;
      background: #000;
      pointer-events: none;
    }
    .video-symbol {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(246, 241, 232, .72);
      border-radius: 50%;
      background: rgba(17, 17, 17, .48);
      color: var(--paper);
      font-size: 19px;
      line-height: 1;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity .18s ease, transform .18s ease;
    }
    .video-toggle.is-playing .video-symbol { opacity: 0; transform: translate(-50%, -50%) scale(.9); }
    .cta-wrap { display: flex; justify-content: center; }
    .whatsapp {
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      border: 1px solid var(--copper);
      border-radius: 9px;
      background: var(--copper);
      color: #fff;
      font-size: 16px;
      font-weight: 760;
      line-height: 1;
      text-align: center;
      text-decoration: none;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }
    .whatsapp:hover { background: var(--copper-bright); border-color: var(--copper-bright); transform: translateY(-1px); }
    .whatsapp:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    @media (max-width: 560px) {

      .brand img { width: 38px; height: 38px; }
      h1 { max-width: 18ch; font-size: clamp(29px, 8.2vw, 35px); line-height: 1.1; }
      .lead { max-width: 31ch; margin-top: 15px; font-size: 16px; }
      .video-shell { border-radius: 10px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>

<body>
  <noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=502759528362336&ev=PageView&noscript=1"></noscript>
  <main class="page">
    <header class="brand" aria-label="Advanx IA">
      <img src="https://lhbwfbquxkutcyqazpnw.supabase.co/storage/v1/render/image/public/images/logo/logo-advanx-transparente.webp?width=96&height=96&resize=contain&format=webp" width="42" height="42" fetchpriority="high" decoding="async" alt="Advanx">
    </header>

    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title"><span class="audience">Advogado,</span> vamos te ajudar a <strong>fechar contratos</strong> com o digital</h1>
      <p class="lead">Confira nessa apresentação alguns resultados e o que entregamos para você.</p>
    </section>

    <section class="video-shell" aria-label="Apresentação em vídeo">
      <button class="video-toggle" id="videoToggle" type="button" aria-label="Dar play no vídeo" aria-pressed="false">
        <video id="casesVideo" preload="metadata" playsinline poster="https://res.cloudinary.com/dmf4bqbdd/video/upload/so_1/lp_cases_ipymhl.jpg">
          <source src="https://res.cloudinary.com/dmf4bqbdd/video/upload/q_auto:eco/v1785251623/lp_cases_ipymhl.mp4" type="video/mp4">
          Seu navegador não suporta vídeo HTML5.
        </video>
        <span class="video-symbol" id="videoSymbol" aria-hidden="true">▶</span>
      </button>
    </section>

    <div class="cta-wrap">
      <a class="whatsapp" id="whatsappCta" href="https://wa.me/5571982470873?text=Oi%2C%20quero%20aumentar%20a%20carteira%20de%20clientes%20do%20escrit%C3%B3rio." target="_blank" rel="noopener">Falar com a Advanx IA no WhatsApp</a>
    </div>
  </main>

  <script>
    'use strict';
    const video = document.getElementById('casesVideo');
    const videoToggle = document.getElementById('videoToggle');
    const videoSymbol = document.getElementById('videoSymbol');
    const whatsappCta = document.getElementById('whatsappCta');
    const attribution = Object.assign({}, window.__advanxAttribution);
    const watchedMilestones = new Set();
    let viewedContent = false;

    function eventPayload(extra) {
      return Object.assign({}, attribution, extra || {});
    }
    function meta(eventName, payload) {
      try { fbq('track', eventName, payload); } catch (_) {}
    }
    function analytics(eventName, payload) {
      try { gtag('event', eventName, payload); } catch (_) {}
    }
    function dataEvent(eventName, payload) {
      window.dataLayer.push(Object.assign({ event: eventName }, payload));
    }
    function trackCustom(eventName, extra) {
      const payload = eventPayload(extra);
      analytics(eventName, payload);
      dataEvent(eventName, payload);
    }
    function trackVideoView() {
      if (viewedContent) return;
      viewedContent = true;
      const payload = eventPayload({ content_name: 'Apresentação de resultados', content_type: 'video' });
      meta('ViewContent', payload);
      analytics('view_content', payload);
      dataEvent('view_content', payload);
      trackCustom('video_start', { video_title: 'lp_cases_ipymhl' });
    }
    function setVideoState(isPlaying) {
      videoToggle.classList.toggle('is-playing', isPlaying);
      videoToggle.setAttribute('aria-pressed', String(isPlaying));
      videoToggle.setAttribute('aria-label', isPlaying ? 'Pausar vídeo' : 'Dar play no vídeo');
      videoSymbol.textContent = isPlaying ? 'Ⅱ' : '▶';
    }
    async function toggleVideo() {
      if (video.paused || video.ended) {
        try { await video.play(); } catch (_) { setVideoState(false); }
      } else video.pause();
    }

    videoToggle.addEventListener('click', toggleVideo);
    video.addEventListener('play', () => { trackVideoView(); setVideoState(true); });
    video.addEventListener('pause', () => { if (!video.ended) setVideoState(false); });
    video.addEventListener('ended', () => { setVideoState(false); });
    video.addEventListener('timeupdate', () => {
      if (!Number.isFinite(video.duration) || video.duration <= 0) return;
      const progress = (video.currentTime / video.duration) * 100;
      [25, 50, 75].forEach((milestone) => {
        if (progress >= milestone && !watchedMilestones.has(milestone)) {
          watchedMilestones.add(milestone);
          trackCustom('video_progress', { video_title: 'lp_cases_ipymhl', video_percent: milestone });
        }
      });
    });
    video.addEventListener('ended', () => {
      if (watchedMilestones.has(100)) return;
      watchedMilestones.add(100);
      trackCustom('video_complete', { video_title: 'lp_cases_ipymhl', video_percent: 100 });
    });
    whatsappCta.addEventListener('click', () => {
      const payload = eventPayload({ content_name: 'WhatsApp Advanx IA', outbound: true });
      meta('Contact', payload);
      analytics('contact', payload);
      dataEvent('contact', payload);
      trackCustom('outbound_whatsapp_click', { destination: 'advanx_ia' });
    });
  </script>
