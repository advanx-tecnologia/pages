  <script>
    'use strict';
    const video = document.getElementById('casesVideo');
    const videoToggle = document.getElementById('videoToggle');
    const videoSymbol = document.getElementById('videoSymbol');
    const whatsappCta = document.getElementById('whatsappCta');
    const attribution = Object.assign({}, window.__advanxAttribution);
    const watchedMilestones = new Set();
    let viewedContent = false;

    function eventPayload(extra) {
      return Object.assign({}, attribution, extra || {});
    }
    function meta(eventName, payload) {
      try { fbq('track', eventName, payload); } catch (_) {}
    }
    function analytics(eventName, payload) {
      try { gtag('event', eventName, payload); } catch (_) {}
    }
    function dataEvent(eventName, payload) {
      window.dataLayer.push(Object.assign({ event: eventName }, payload));
    }
    function trackCustom(eventName, extra) {
      const payload = eventPayload(extra);
      analytics(eventName, payload);
      dataEvent(eventName, payload);
    }
    function trackVideoView() {
      if (viewedContent) return;
      viewedContent = true;
      const payload = eventPayload({ content_name: 'Apresentação de resultados', content_type: 'video' });
      meta('ViewContent', payload);
      analytics('view_content', payload);
      dataEvent('view_content', payload);
      trackCustom('video_start', { video_title: 'lp_cases_ipymhl' });
    }
    function setVideoState(isPlaying) {
      videoToggle.classList.toggle('is-playing', isPlaying);
      videoToggle.setAttribute('aria-pressed', String(isPlaying));
      videoToggle.setAttribute('aria-label', isPlaying ? 'Pausar vídeo' : 'Dar play no vídeo');
      videoSymbol.textContent = isPlaying ? 'Ⅱ' : '▶';
    }
    async function toggleVideo() {
      if (video.paused || video.ended) {
        try { await video.play(); } catch (_) { setVideoState(false); }
      } else video.pause();
    }

    videoToggle.addEventListener('click', toggleVideo);
    video.addEventListener('play', () => { trackVideoView(); setVideoState(true); });
    video.addEventListener('pause', () => { if (!video.ended) setVideoState(false); });
    video.addEventListener('ended', () => { setVideoState(false); });
    video.addEventListener('timeupdate', () => {
      if (!Number.isFinite(video.duration) || video.duration <= 0) return;
      const progress = (video.currentTime / video.duration) * 100;
      [25, 50, 75].forEach((milestone) => {
        if (progress >= milestone && !watchedMilestones.has(milestone)) {
          watchedMilestones.add(milestone);
          trackCustom('video_progress', { video_title: 'lp_cases_ipymhl', video_percent: milestone });
        }
      });
    });
    video.addEventListener('ended', () => {
      if (watchedMilestones.has(100)) return;
      watchedMilestones.add(100);
      trackCustom('video_complete', { video_title: 'lp_cases_ipymhl', video_percent: 100 });
    });

      analytics('contact', payload);
      dataEvent('contact', payload);
