<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando | Advanx IA</title>
    
    <!-- Scripts do Tailwind CSS e Fontes Google -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // ========================================================
        // ⚙️ CONFIGURAÇÃO DE RASTREAMENTO (INSIRA SEUS IDs AQUI)
        // ========================================================
        const META_PIXEL_ID = '502759528362336';      // Exemplo: '123456789012345'
        const GA4_MEASUREMENT_ID = 'G-98EL5GXG5F'; // Exemplo: 'G-XXXXXXXXXX'
    </script>

    <!-- Meta Pixel Code -->
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');

        if (typeof META_PIXEL_ID !== 'undefined' && META_PIXEL_ID && META_PIXEL_ID !== '502759528362336') {
            fbq('init', META_PIXEL_ID);
            fbq('track', 'PageView');
        }
    </script>

    <!-- Google Analytics 4 (gtag.js) -->
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        if (typeof GA4_MEASUREMENT_ID !== 'undefined' && GA4_MEASUREMENT_ID && GA4_MEASUREMENT_ID !== 'G-98EL5GXG5F') {
            const gaScript = document.createElement('script');
            gaScript.async = true;
            gaScript.src = `https://www.googletagmanager.com/gtag/js?id=${GA4_MEASUREMENT_ID}`;
            document.head.appendChild(gaScript);

            gtag('config', GA4_MEASUREMENT_ID, {
                'send_page_view': true
            });
        }
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Outfit', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    colors: {
                        claude: {
                            bg: '#0c0b0a',
                            card: '#151311',
                            cardBorder: '#282420',
                            accent: '#DA7756',
                            accentHover: '#E58869',
                            glow: 'rgba(218, 119, 86, 0.15)',
                            muted: '#8e8a85',
                            subtle: '#211e1a'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0c0b0a;
            color: #f5f4f2;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(218, 119, 86, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 80% 100%, rgba(20, 18, 16, 0.8) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* Efeito de círculo de progresso */
        .circle-bar {
            transition: stroke-dashoffset 1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Efeito de brilho em bordas */
        .premium-border {
            position: relative;
        }
        .premium-border::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 1.25rem;
            padding: 1px;
            background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(218,119,86,0.25) 50%, rgba(255,255,255,0.02) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col justify-center items-center p-4 antialiased selection:bg-claude-accent selection:text-white">

    <main class="w-full max-w-md my-auto relative z-10">
        
        <!-- Ambient Glow atrás do card -->
        <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-64 h-64 bg-claude-accent/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="bg-claude-card/90 backdrop-blur-xl border border-claude-cardBorder rounded-2xl p-8 sm:p-10 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.7)] text-center relative overflow-hidden premium-border">
            
            <!-- Logo da Marca Advanx IA -->
            <div class="mb-8 flex justify-center">
                <img src="https://res.cloudinary.com/dmf4bqbdd/image/upload/v1784400742/Logo_Advanx_IA_Transparante_v3_kgirrz.png" 
                     alt="Advanx IA" 
                     class="h-10 sm:h-12 w-auto object-contain drop-shadow-[0_4px_12px_rgba(0,0,0,0.5)] transition-transform duration-300 hover:scale-105"
                     onerror="this.onerror=null; this.src='https://placehold.co/200x50/151311/DA7756?text=Advanx+IA';" />
            </div>

            <!-- Tag de status de canal seguro -->
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-claude-subtle/80 border border-claude-cardBorder text-[11px] font-mono text-claude-muted mb-6 tracking-wide">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Conexão direta ativada</span>
            </div>

            <!-- Contador Circular Elegante -->
            <div class="relative w-28 h-28 mx-auto my-4 flex items-center justify-center">
                <svg class="w-full h-full" viewBox="0 0 100 100">
                    <!-- Anel de fundo -->
                    <circle cx="50" cy="50" r="42" stroke="currentColor" stroke-width="4" class="text-claude-cardBorder" fill="none" />
                    <!-- Anel de progresso -->
                    <circle id="progress-circle" cx="50" cy="50" r="42" stroke="currentColor" stroke-width="4" 
                            class="text-claude-accent circle-bar drop-shadow-[0_0_8px_rgba(218,119,86,0.4)]" 
                            fill="none" 
                            stroke-dasharray="263.89" 
                            stroke-dashoffset="0" 
                            stroke-linecap="round" />
                </svg>
                
                <!-- Número central -->
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span id="countdown-number" class="font-heading text-4xl font-bold text-white tracking-tight">5</span>
                    <span class="text-[10px] uppercase tracking-widest text-claude-muted font-mono mt-0.5">seg</span>
                </div>
            </div>

            <!-- Mensagem ao usuário -->
            <h1 class="font-heading text-lg font-medium text-white/90 mt-6 mb-2 tracking-tight">
                Redirecionando para o WhatsApp
            </h1>
            <p class="text-xs text-claude-muted font-normal leading-relaxed max-w-xs mx-auto">
                Você será transferido para a conversa oficial em instantes.
            </p>

            <div class="mt-8">
                <a id="whatsapp-btn" 
                   href="#" 
                   class="group relative inline-flex items-center justify-center w-full px-6 py-3.5 text-sm font-semibold text-white transition-all duration-300 bg-gradient-to-r from-claude-accent to-[#C86343] hover:from-claude-accentHover hover:to-claude-accent rounded-xl shadow-[0_4px_20px_rgba(218,119,86,0.25)] hover:shadow-[0_6px_25px_rgba(218,119,86,0.4)] active:scale-[0.98] overflow-hidden">
                    
                    <!-- Brilho no hover -->
                    <span class="absolute inset-0 w-full h-full bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></span>
                    
                    <i class="fa-brands fa-whatsapp text-lg mr-2.5 transition-transform duration-300 group-hover:scale-110"></i>
                    <span>Ir para o WhatsApp agora</span>
                    <i class="fa-solid fa-arrow-right text-xs ml-2 opacity-70 transition-transform duration-300 group-hover:translate-x-1"></i>
                </a>
            </div>

            <div id="utm-container" class="mt-8 pt-5 border-t border-claude-cardBorder/60 text-left hidden">
                <div class="flex items-center justify-between text-[11px] font-mono text-claude-muted mb-2">
                    <span class="flex items-center gap-1.5 text-claude-accent/90">
                        <i class="fa-solid fa-sliders text-[10px]"></i> Parâmetros detectados
                    </span>
                    <span id="utm-count-badge" class="px-1.5 py-0.5 rounded bg-claude-subtle text-claude-muted font-mono text-[10px]">0</span>
                </div>
                <div id="utm-tags" class="flex flex-wrap gap-1.5 max-h-20 overflow-y-auto pt-1">
                    <!-- Badges de UTM são inseridos via JS -->
                </div>
            </div>

        </div>

        <!-- Rodapé discreto -->
        <p class="text-center text-[11px] text-claude-muted/60 mt-6 font-mono">
            Advanx IA &bull; Atendimento Inteligente
        </p>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const baseWaUrl = "https://wa.me/5571981897865?text=Oi%20rafael%2C%20tudo%20certo%20por%20ai%3F";
            let timeLeft = 5;
            const totalTime = 5;
            let hasTrackedContact = false;

            const countdownEl = document.getElementById('countdown-number');
            const progressCircle = document.getElementById('progress-circle');
            const whatsappBtn = document.getElementById('whatsapp-btn');
            const utmContainer = document.getElementById('utm-container');
            const utmTags = document.getElementById('utm-tags');
            const utmCountBadge = document.getElementById('utm-count-badge');

            // Perímetro do círculo r=42 -> 2 * PI * 42 = ~263.89
            const circleCircumference = 263.89;

            function fireContactEvent(triggerType = 'auto') {
                if (hasTrackedContact) return;
                hasTrackedContact = true;

                // Disparo no Meta Pixel (silencioso)
                if (window.fbq && typeof META_PIXEL_ID !== 'undefined' && META_PIXEL_ID !== '502759528362336') {
                    fbq('track', 'Contact', {
                        content_name: 'WhatsApp Redirect Advanx',
                        trigger: triggerType
                    });
                }

                // Disparo no GA4 (silencioso)
                if (window.gtag && typeof GA4_MEASUREMENT_ID !== 'undefined' && GA4_MEASUREMENT_ID !== 'G-98EL5GXG5F') {
                    gtag('event', 'contact', {
                        'event_category': 'WhatsApp',
                        'event_label': triggerType === 'click' ? 'Clique Manual' : 'Redirecionamento Automatico'
                    });
                }
            }

            function buildDestinationUrl() {
                try {
                    const currentSearchParams = new URLSearchParams(window.location.search);
                    const targetUrl = new URL(baseWaUrl);

                    let paramCount = 0;

                    currentSearchParams.forEach((value, key) => {
                        targetUrl.searchParams.set(key, value);
                        paramCount++;

                        if (utmContainer && utmTags) {
                            const badge = document.createElement('span');
                            badge.className = "inline-flex items-center px-2 py-0.5 rounded text-[10px] font-mono bg-claude-subtle text-claude-muted border border-claude-cardBorder";
                            badge.innerHTML = `<span class="text-claude-accent/80 mr-1">${escapeHtml(key)}:</span>${escapeHtml(value)}`;
                            utmTags.appendChild(badge);
                        }
                    });

                    if (paramCount > 0 && utmContainer) {
                        utmContainer.classList.remove('hidden');
                        if (utmCountBadge) utmCountBadge.textContent = `${paramCount}`;
                    }

                    return targetUrl.toString();
                } catch (e) {
                    console.error("Erro ao processar parâmetros:", e);
                    return baseWaUrl;
                }
            }

            function escapeHtml(str) {
                return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
            }

            const finalDestinationUrl = buildDestinationUrl();
            whatsappBtn.href = finalDestinationUrl;

            // Animação de contagem
            const timer = setInterval(() => {
                timeLeft -= 1;

                if (timeLeft >= 0) {
                    countdownEl.textContent = timeLeft;
                    
                    // Cálculo do deslocamento do anel em SVG
                    const offset = circleCircumference - ((timeLeft / totalTime) * circleCircumference);
                    progressCircle.style.strokeDashoffset = offset;
                }

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    fireContactEvent('auto');
                    window.location.href = finalDestinationUrl;
                }
            }, 1000);

            // Clique manual do botão
            whatsappBtn.addEventListener('click', () => {
                clearInterval(timer);
                fireContactEvent('click');
            });
        });
    </script>
</body>
</html>
