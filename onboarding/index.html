<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cadastro do cliente — Advanx</title>
<style>
  :root { --p:#2563eb; --p10:#2563eb1a; --bg:#f7f8fb; --card:#fff; --tx:#0f172a; --mu:#64748b; --bd:#e2e8f0; --er:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--tx);
    background:linear-gradient(180deg,var(--p10),var(--bg) 40%); min-height:100vh; padding:32px 16px; }
  .wrap { max-width:672px; margin:0 auto; }
  .topo { text-align:center; margin-bottom:24px; }
  .topo img { height:40px; margin-bottom:12px; }
  h1 { font-size:24px; margin:0; font-weight:600; }
  .sub { color:var(--mu); font-size:14px; margin-top:4px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:16px; padding:20px; box-shadow:0 10px 30px #0f172a14; }
  @media (min-width:640px){ .card{ padding:32px; } }
  .prog-info { display:flex; justify-content:space-between; font-size:12px; color:var(--mu); margin-bottom:8px; }
  .barra { height:8px; background:var(--bd); border-radius:99px; overflow:hidden; }
  .barra i { display:block; height:100%; background:var(--p); transition:width .2s; }
  .passos { display:none; gap:8px; margin-top:12px; }
  @media (min-width:640px){ .passos{ display:flex; } }
  .passos span { flex:1; text-align:center; font-size:12px; padding:4px 8px; border-radius:99px; background:#f1f5f9; color:var(--mu); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .passos span.at { background:var(--p); color:#fff; } .passos span.ok { background:var(--p10); color:var(--p); }
  h2 { font-size:18px; margin:24px 0 2px; font-weight:600; }
  .desc { color:var(--mu); font-size:14px; margin:0 0 20px; }
  .grade { display:grid; gap:16px; grid-template-columns:1fr; }
  @media (min-width:640px){ .grade{ grid-template-columns:1fr 1fr; } .inteiro{ grid-column:span 2; } }
  label { display:block; font-size:14px; font-weight:500; margin-bottom:6px; }
  input, textarea { width:100%; font:inherit; font-size:15px; padding:9px 12px; border:1px solid var(--bd); border-radius:8px; background:#fff; color:var(--tx); }
  input:focus, textarea:focus { outline:2px solid var(--p10); border-color:var(--p); }
  textarea { resize:vertical; min-height:76px; }
  .resp { border:1px solid var(--bd); background:#f8fafc; border-radius:12px; padding:16px; margin-top:12px; }
  .resp .cab { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:14px; font-weight:500; }
  .btn { font:inherit; font-size:15px; border-radius:8px; padding:10px 16px; cursor:pointer; border:1px solid var(--bd); background:#fff; color:var(--tx); }
  .btn.pri { background:var(--p); border-color:var(--p); color:#fff; flex:1; font-weight:500; }
  .btn.pri:disabled { opacity:.6; cursor:wait; }
  .btn.trac { width:100%; border-style:dashed; margin-top:12px; }
  .btn.mini { padding:4px 10px; font-size:13px; }
  .acoes { display:flex; gap:12px; margin-top:32px; }
  .aviso { margin-top:16px; padding:10px 12px; border-radius:8px; background:#fef2f2; color:var(--er); font-size:14px; display:none; }
  .fim { text-align:center; padding:40px 0; }
  .fim .ok { width:56px; height:56px; border-radius:50%; background:var(--p); color:#fff; font-size:30px; line-height:56px; margin:0 auto 16px; }
  .fim p { color:var(--mu); }
  .isca { position:absolute; left:-9999px; }
  .carregando { text-align:center; padding:48px 0; color:var(--mu); }
</style>
</head>

      { k: 'endereco', l: 'Rua / avenida' },
      { k: 'endereco_numero', l: 'Número', m: 1 },
      { k: 'endereco_complemento', l: 'Complemento', m: 1 },
      { k: 'bairro', l: 'Bairro' },
    ]},
    { titulo: 'Seu negócio', descricao: 'Para a gente falar com o cliente certo.', campos: [
      { k: 'nicho', l: 'Nicho / área de atuação' },
      { k: 'servicos', l: 'Principais serviços ou produtos', g: 1 },
      { k: 'publico_alvo', l: 'Quem é o seu cliente ideal?', g: 1 },
      { k: 'cidade_atuacao', l: 'Cidade / região que atende', m: 1 },
      { k: 'horario_atendimento', l: 'Horário de atendimento', m: 1 },
      { k: 'telefone_leads', l: 'WhatsApp que recebe os leads', t: 'tel', m: 1 },
      { k: 'ticket_medio', l: 'Ticket médio por cliente', m: 1 },
      { k: 'diferenciais', l: 'Seus diferenciais', g: 1 },
      { k: 'concorrentes', l: 'Principais concorrentes', g: 1 },
    ]},
    { titulo: 'Presença online e anúncios', descricao: 'Última etapa. Pode deixar em branco o que não tiver.', campos: [
      { k: 'site_url', l: 'Site ou landing page', p: 'https://' },
      { k: 'instagram', l: 'Instagram', p: '@suaempresa', m: 1 },
      { k: 'facebook_pagina', l: 'Página do Facebook (link)', m: 1 },
      { k: 'google_meu_negocio', l: 'Perfil no Google (link)' },
      { k: 'anunciante_nome', l: 'Nome que aparece como anunciante (pessoa ou empresa)', m: 1 },
      { k: 'anunciante_documento', l: 'CPF ou CNPJ do anunciante', m: 1 },
      { k: 'objetivo', l: 'Principal objetivo com os anúncios', g: 1 },
      { k: 'verba_ads', l: 'Verba mensal para anúncios (R$)', p: 'Ex.: 1500', m: 1 },
      { k: 'conta_anuncio_meta', l: 'Já tem conta de anúncios na Meta? Se sim, cole o ID (ex.: act_123… ou só os números)', p: 'act_123456789', m: 1 },
      { k: 'servicos_prioridade', l: 'Quais serviços/teses quer anunciar primeiro? Em ordem de prioridade', g: 1 },
      { k: 'observacoes', l: 'Algo mais que devemos saber?', g: 1 },
    ]},
  ];

  const m = location.pathname.match(/^\/onboarding\/([0-9a-f-]{36})\/?$/i);
  const token = m ? m[1] : null;
  const novo = !token;
  let etapa = 0, nome = '', dados = {}, resp = [], enviando = false;
  const card = document.getElementById('card');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  function telefoneWhatsapp(bruto) {
    let d = String(bruto || '').replace(/\D/g, '').replace(/^0+/, '');
    if (d.length === 10 || d.length === 11) d = '55' + d;
    return d.startsWith('55') && (d.length === 12 || d.length === 13) ? d : null;
  }

  async function chamar(body) {
    const r = await fetch(FUNCAO, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CHAVE }, body: JSON.stringify(body) });
    let j = {}; try { j = await r.json(); } catch {}
    if (!r.ok || j.error) throw new Error(j.error || 'Erro ao enviar. Tente de novo.');
    return j;
  }

  function lerTela() {
    card.querySelectorAll('[data-k]').forEach((el) => { dados[el.dataset.k] = el.value; });
    card.querySelectorAll('[data-r]').forEach((el) => { const [i, c] = el.dataset.r.split(':'); if (resp[i]) resp[i][c] = el.value; });
  }

  function aviso(txt) { const a = card.querySelector('.aviso'); if (a) { a.textContent = txt; a.style.display = txt ? 'block' : 'none'; } }

  function validar() {
    const ok = (v) => telefoneWhatsapp(v) !== null;
    if (etapa === 0) {
      if (!(dados.responsavel_nome || '').trim()) return 'Informe o seu nome.';
      if (!ok(dados.telefone)) return 'Informe o seu WhatsApp com DDD. Ex.: (71) 99999-9999';
      const inc = resp.find((r) => (r.nome.trim() || r.telefone.trim()) && !(r.nome.trim() && r.telefone.trim()));
      if (inc) return 'Preencha nome e WhatsApp de cada responsável (ou remova o que não for usar).';
      const inv = resp.find((r) => r.telefone.trim() && !ok(r.telefone));
      if (inv) return 'WhatsApp de ' + (inv.nome || 'responsável') + ' inválido. Use DDD + número.';
    }
    if (etapa === 1) {
      const d = (dados.cpf_cnpj || '').replace(/\D/g, '');
      if (d.length !== 11 && d.length !== 14) return 'Informe o CPF (11 dígitos) ou CNPJ (14 dígitos).';
    }
    if (etapa === 3 && (dados.anunciante_documento || '').trim()) {
      const d = dados.anunciante_documento.replace(/\D/g, '');
      if (d.length !== 11 && d.length !== 14) return 'CPF ou CNPJ do anunciante inválido.';
    }
    // Mesma regra da função: "act_" opcional e só dígitos
    if (etapa === 3 && (dados.conta_anuncio_meta || '').trim() && !/^(act_)?\d{6,20}$/i.test(dados.conta_anuncio_meta.replace(/\s/g, ''))) {
      return 'ID da conta de anúncios inválido. Use act_ seguido dos números, ou só os números.';
    }
    return null;
  }

  // Máscaras (Rafael 23/11): telefone, CPF/CNPJ e CEP formatados enquanto digita.
  const so = (v, n) => String(v || '').replace(/\D/g, '').slice(0, n);
  function mTel(v) { let d = so(v, 13); if (d.length > 11 && d.startsWith('55')) d = d.slice(2); d = d.slice(0, 11);
    if (d.length <= 2) return d ? '(' + d : ''; if (d.length <= 6) return '(' + d.slice(0,2) + ') ' + d.slice(2);
    if (d.length <= 10) return '(' + d.slice(0,2) + ') ' + d.slice(2,6) + '-' + d.slice(6);
    return '(' + d.slice(0,2) + ') ' + d.slice(2,7) + '-' + d.slice(7); }
  function mDoc(v) { const d = so(v, 14);
    if (d.length <= 11) return d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/, '.$1-$2');
    return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d{1,2})$/, '$1-$2'); }
  function mCep(v) { const d = so(v, 8); return d.length > 5 ? d.slice(0,5) + '-' + d.slice(5) : d; }
  const MASC = { telefone: mTel, telefone_leads: mTel, cpf_cnpj: mDoc, anunciante_documento: mDoc, cep: mCep };
  function mascarar() {
    card.querySelectorAll('[data-k], [data-r$=":telefone"]').forEach((el) => {
      const f = el.dataset.r ? mTel : MASC[el.dataset.k]; if (!f) return;
      el.setAttribute('inputmode', 'numeric');
      if (el.value) el.value = f(el.value);
      el.addEventListener('input', () => { el.value = f(el.value); });
    });
  }

  function campo(c) {
    const v = esc(dados[c.k] || '');
    const ctl = c.g
      ? `<textarea id="${c.k}" data-k="${c.k}" maxlength="1000" rows="3">${v}</textarea>`
      : `<input id="${c.k}" data-k="${c.k}" type="${c.t || 'text'}" placeholder="${esc(c.p || '')}" maxlength="300" value="${v}">`;
    return `<div class="${c.m ? '' : 'inteiro'}"><label for="${c.k}">${esc(c.l)}</label>${ctl}</div>`;
  }

  function desenhar() {
    const e = ETAPAS[etapa], pct = Math.round(((etapa + 1) / ETAPAS.length) * 100);
    let html = `<form id="f" novalidate>
      <input class="isca" type="text" name="site_extra" id="isca" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="prog-info"><span>Etapa ${etapa + 1} de ${ETAPAS.length}</span><span>${pct}%</span></div>
      <div class="barra"><i style="width:${pct}%"></i></div>
      <div class="passos">${ETAPAS.map((x, i) => `<span class="${i === etapa ? 'at' : i < etapa ? 'ok' : ''}" data-ir="${i}">${esc(x.titulo)}</span>`).join('')}</div>
      <h2>${esc(e.titulo)}</h2><p class="desc">${esc(e.descricao)}</p>
      <div class="grade">${e.campos.map(campo).join('')}</div>`;
    if (etapa === 0) {
      html += resp.map((r, i) => `<div class="resp"><div class="cab"><span>Responsável ${i + 2}</span><button type="button" class="btn mini" data-rm="${i}">Remover</button></div>
        <div class="grade"><input data-r="${i}:nome" placeholder="Nome" maxlength="100" value="${esc(r.nome)}">
        <input data-r="${i}:telefone" type="tel" placeholder="WhatsApp" maxlength="20" value="${esc(r.telefone)}">
        <input class="inteiro" data-r="${i}:papel" placeholder="Função (ex.: sócio, gerente)" maxlength="60" value="${esc(r.papel)}"></div></div>`).join('');
      if (resp.length < MAX_RESP) html += `<button type="button" class="btn trac" id="add">+ ${resp.length ? 'Adicionar mais um responsável' : 'Adicionar outro sócio ou responsável'}</button>`;
    }
    html += `<div class="aviso"></div><div class="acoes">
      ${etapa > 0 ? '<button type="button" class="btn" id="voltar">← Voltar</button>' : ''}
      <button type="submit" class="btn pri" id="ir"${enviando ? ' disabled' : ''}>${etapa < ETAPAS.length - 1 ? 'Continuar →' : (enviando ? 'Enviando…' : 'Enviar cadastro')}</button>
    </div></form>`;
    card.innerHTML = html;
    mascarar();
    const f = card.querySelector('#f');
    f.addEventListener('submit', enviar);
    card.querySelector('#voltar')?.addEventListener('click', () => { lerTela(); ir(etapa - 1); });
    card.querySelector('#add')?.addEventListener('click', () => { lerTela(); resp.push({ nome: '', telefone: '', papel: '' }); desenhar(); });
    card.querySelectorAll('[data-rm]').forEach((b) => b.addEventListener('click', () => { lerTela(); resp.splice(+b.dataset.rm, 1); desenhar(); }));
    card.querySelectorAll('[data-ir]').forEach((b) => b.addEventListener('click', () => { const i = +b.dataset.ir; if (i < etapa) { lerTela(); ir(i); } }));
    const cep = card.querySelector('#cep');
    cep?.addEventListener('input', () => buscarCep(cep.value));
  }

  function ir(para) {
    if (para > etapa) { const p = validar(); if (p) { aviso(p); return; } }
    etapa = para; desenhar(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function buscarCep(v) {
    const cep = String(v || '').replace(/\D/g, '');
    if (cep.length !== 8) return;
    fetch('https://viacep.com.br/ws/' + cep + '/json/').then((r) => r.json()).then((r) => {
      if (!r || r.erro) return;
      const rua = card.querySelector('#endereco'), bai = card.querySelector('#bairro');
      if (rua && !rua.value) rua.value = r.logradouro || '';
      if (bai && !bai.value) bai.value = r.bairro || '';
    }).catch(() => {});
  }

  async function enviar(ev) {
    ev.preventDefault(); lerTela();
    if (etapa < ETAPAS.length - 1) { ir(etapa + 1); return; }
    const p = validar(); if (p) { aviso(p); return; }
    enviando = true; desenhar();
    const isca = document.getElementById('isca')?.value || '';
    const lista = resp.filter((r) => r.nome.trim() || r.telefone.trim());
    try {
      await chamar(novo ? { acao: 'cadastrar', dados, responsaveis: lista, site_extra: isca } : { token, acao: 'salvar', dados, responsaveis: lista });
      card.innerHTML = `<div class="fim"><div class="ok">✓</div><h2>Cadastro enviado!</h2>
        <p>Obrigado. Nossa equipe segue com o seu onboarding.</p>
        <p>Para verificar o anunciante, a Meta pede a foto de um documento (RG ou CNH) de quem aparece como anunciante. Mande no nosso grupo do WhatsApp assim que ele for criado.</p></div>`;
    } catch (e) { enviando = false; desenhar(); aviso(e.message); }
  }

  async function iniciar() {
    if (novo) { desenhar(); return; }
    try {
      const j = await chamar({ token, acao: 'ler' });
      nome = j.nome || ''; dados = j.dados || {}; resp = Array.isArray(j.responsaveis) ? j.responsaveis.map((r) => ({ nome: r.nome || '', telefone: r.telefone || '', papel: r.papel || '' })) : [];
      if (nome) document.getElementById('titulo').textContent = 'Olá, ' + nome + '!';
      desenhar();
    } catch (e) { card.innerHTML = `<div class="carregando">${esc(e.message || 'Link inválido ou expirado.')}</div>`; }
  }
  iniciar();
})();
</script>
</body>
</html>
