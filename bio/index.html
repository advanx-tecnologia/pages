*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#dcdcd8;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--sora);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
button,a{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{cursor:pointer;border:0;background:none;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.screen{position:relative;width:var(--w);height:var(--hh);background:var(--paper);overflow:hidden;isolation:isolate}
@media (min-width:600px){body{align-items:center}.screen{box-shadow:0 0 0 1px var(--line),0 30px 80px -30px rgba(10,10,10,.35);border-radius:22px;height:min(100dvh - 32px,860px)}:root{--hh:min(100dvh - 32px,860px)}}

/* ====== MOVIMENTO (medido ao vivo nos dois sites, ver LEIA-ME) ======
   LinkIA  aeris-rise 0,7 s ease, 18 px, 0,12 s entre itens · aeris-pulse 2,6 s scale 1,015 + anel 14 px · btn-shine · typing-dot
   Black   mola .3,1.35,.5,1 em 375 ms · fill .2,.9,.25,1 · rip (scale .3→1.6, 0,9→0) · logIn (8 px + scale .96) · reveal 625–750 ms
   Aqui: deslocamento maior (34 px) e 110 ms entre itens para ser visível no celular; fill-mode "backwards"
   para a animação nunca segurar o estado final e brigar com :active. */
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.97)}to{opacity:1;transform:none}}
.rise{animation:rise 900ms var(--snappy) backwards;animation-delay:calc(var(--i,0) * 110ms + 150ms)}
@keyframes capa-in{from{opacity:0;transform:scale(1.16);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes respira{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes letra{from{opacity:0;transform:translateY(.6em);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@keyframes seta-in{from{opacity:0;transform:rotate(-120deg) scale(.3)}to{opacity:1;transform:none}}
@keyframes brilho{0%{background-position:140% 0}55%,100%{background-position:-70% 0}}
@keyframes onda{0%{opacity:.24;transform:scale(.2)}100%{opacity:0;transform:scale(1.7)}}
.nome{white-space:nowrap}
.nome .l{display:inline-block;animation:letra 850ms var(--soft) backwards;animation-delay:calc(480ms + var(--k,0) * 40ms)}
.acao.rise .seta,.acao.rise .ico{animation:seta-in 900ms var(--snappy) backwards;animation-delay:calc(var(--i,0) * 110ms + 420ms)}
.onda{position:absolute;z-index:0;border-radius:50%;background:currentColor;pointer-events:none;animation:onda 650ms var(--soft) both}
/* pré-visualização de estados: #antes (antes da entrada) e #depois (final) */
[data-estado=antes] :is(.rise,.capa,.nome .l,.redes a){animation:none!important;opacity:0}
[data-estado=depois] .tela-base *{animation:none!important}
.reinicia .tela-base *{animation:none!important}

.eyebrow{font:500 10.5px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:.7em;align-items:center;justify-content:center}
.eyebrow i{font-style:normal;font-size:8px;color:var(--ink)}
.nome{font:300 22px/1.1 var(--sora);letter-spacing:.3em;text-transform:uppercase;text-align:center;color:var(--ink);padding-left:.3em}

/* ====== os três botões: mesma anatomia (texto + círculo de seta), três níveis ====== */
.acao{--bg:var(--white);--fg:var(--ink);--swp:var(--ink);--swf:var(--white);
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:56px;
  padding:0 8px 0 22px;border-radius:999px;background:var(--bg);color:var(--fg);text-align:left;text-decoration:none;
  font:600 13px/1.25 var(--sora);letter-spacing:.07em;text-transform:uppercase;overflow:hidden;isolation:isolate;
  transition:transform calc(var(--u)*3) var(--snappy),color 240ms var(--soft),box-shadow 240ms var(--soft),opacity 300ms var(--soft)}
.acao::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--swp);transform:translateY(101%);transition:transform calc(var(--u)*3) var(--soft)}
.acao .txt{flex:1;min-width:0}
.acao .seta{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--white);transition:transform calc(var(--u)*3) var(--snappy),background 240ms var(--soft),color 240ms var(--soft)}
.acao .seta svg{width:16px;height:16px;display:block}
.acao .ico{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--white);margin-left:-8px;transition:background 240ms var(--soft),color 240ms var(--soft)}
.acao .ico svg{width:18px;height:18px}
/* toque e hover: preenche por baixo, texto inverte, seta gira -45° (Black) */
.acao:active{transform:scale(.97)}
.acao:active::before,.acao.toque::before{transform:translateY(0)}
.acao:active,.acao.toque{color:var(--swf)}
.acao:active .seta,.acao.toque .seta{transform:rotate(-45deg) scale(1.08);background:var(--white);color:var(--ink)}
@media (hover:hover) and (pointer:fine){
  .acao:hover::before{transform:translateY(0)}
  .acao:hover{color:var(--swf)}
  .acao:hover .seta{transform:rotate(-45deg) scale(1.08);background:var(--white);color:var(--ink)}
}
/* 1 · primário: Black → pílula cheia, 64 px, sombra de cor */
.acao.p1{border:1.5px solid var(--ink)}
.acao.p1{--bg:var(--ink);--fg:var(--white);--swp:var(--white);--swf:var(--ink);min-height:64px;padding-left:28px;font-size:14px;letter-spacing:.05em;
  box-shadow:0 18px 40px -16px rgba(10,10,10,.65);
  background-image:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.26) 50%,transparent 62%);background-size:250% 100%;background-repeat:no-repeat;background-position:140% 0;
  animation:rise 900ms var(--snappy) backwards,pulso 2.6s ease-in-out 2.3s infinite,brilho 4.4s ease-in-out 2.8s infinite;
  animation-delay:calc(var(--i,0) * 110ms + 150ms),2.3s,2.8s}
.acao.p1 .seta{background:var(--white);color:var(--ink);width:44px;height:44px}
.acao.p1:active .seta,.acao.p1.toque .seta{background:var(--ink);color:var(--white)}
@media (hover:hover) and (pointer:fine){.acao.p1:hover .seta{background:var(--ink);color:var(--white)}}
@keyframes pulso{0%,100%{scale:1;box-shadow:0 18px 40px -16px rgba(10,10,10,.65),0 0 0 0 rgba(10,10,10,.3)}50%{scale:1.012;box-shadow:0 18px 40px -16px rgba(10,10,10,.65),0 0 0 14px rgba(10,10,10,0)}}
/* o pulso usa a propriedade "scale", que se soma ao transform:scale(.97) do :active (sem brigar) */
/* 2 · cartão LinkIA: 28 px, círculo de ícone + título + círculo de seta, anel de 1,5 px e halo */
.acao.p2{border-radius:28px;min-height:76px;padding:14px 14px 14px 16px;gap:12px;box-shadow:0 0 0 1.5px var(--ink) inset,0 0 0 6px rgba(10,10,10,.06);font-size:12.5px;letter-spacing:.08em}
.acao.p2 .ico{margin-left:0}
.acao.p2:active .ico,.acao.p2.toque .ico{background:var(--white);color:var(--ink)}
@media (hover:hover) and (pointer:fine){.acao.p2:hover .ico{background:var(--white);color:var(--ink)}}
/* 3 · WhatsApp: pílula branca com o verde só no círculo; no toque enche de verde */
.acao.mat{box-shadow:0 0 0 1px var(--line) inset}
.acao.p3{--swp:var(--wa);--swf:#06210f;box-shadow:0 0 0 1px var(--line) inset;padding-left:8px}
.acao.p3 .ico{background:var(--wa);color:#06210f;margin-left:0}
.acao.p3 .txt{padding-left:2px}
.acao.p3 .seta{background:var(--ink)}
.acao.p3:active .ico,.acao.p3.toque .ico{background:#06210f;color:var(--wa)}
.acao.p3:active .seta,.acao.p3.toque .seta{background:#06210f;color:var(--wa)}
@media (hover:hover) and (pointer:fine){.acao.p3:hover .ico{background:#06210f;color:var(--wa)}.acao.p3:hover .seta{background:#06210f;color:var(--wa)}}

.rodape{font:400 9.5px/1.4 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);text-align:center}

/* chip da prévia (não faz parte da página final) */
.chip{position:absolute;z-index:30;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.chip span,.chip button{pointer-events:auto;font:500 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:rgba(10,10,10,.78);color:#fff}
@media (hover:hover) and (pointer:fine){.chip button:hover{background:#000}}

/* ====== PAINÉIS: formulário premium, uma pergunta por tela ====== */
.tela-base{transition:opacity 700ms var(--soft),transform 700ms var(--soft)}
.screen.em-painel .tela-base{opacity:.35;transform:scale(.94)}
/* o painel nasce do botão tocado: círculo que abre a partir do centro do botão (Black: reveal 625–750 ms, .2,.9,.25,1) */
.painel{position:absolute;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;
  padding:max(54px,env(safe-area-inset-top)) 0 max(14px,env(safe-area-inset-bottom));visibility:hidden;pointer-events:none;
  clip-path:circle(0px at var(--ox,50%) var(--oy,80%));transition:clip-path 560ms var(--soft),visibility 0s linear 560ms}
.painel.aberto{visibility:visible;pointer-events:auto;clip-path:circle(var(--r,160%) at var(--ox,50%) var(--oy,80%));transition:clip-path 820ms var(--soft),visibility 0s}
@keyframes entra-topo{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes entra-baixo{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.painel.aberto .topo{animation:entra-topo 640ms var(--snappy) 330ms backwards}
.painel.aberto .prog{animation:entra-topo 640ms var(--snappy) 420ms backwards}
.painel.aberto .pe{animation:entra-baixo 700ms var(--snappy) 560ms backwards}

.topo{display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}
.voltar{display:inline-flex;align-items:center;gap:10px;font:500 10.5px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);padding:0 14px 0 0;min-height:44px;border-radius:999px;transition:transform 375ms var(--snappy)}
.voltar b{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;transition:transform 375ms var(--snappy)}
.voltar b svg{width:16px;height:16px;transform:scaleX(-1)}
.voltar:active{transform:scale(.96)}.voltar:active b{transform:translateX(-4px)}
@media (hover:hover) and (pointer:fine){.voltar:hover b{transform:translateX(-4px)}}
.cont{display:flex;align-items:baseline;gap:.55em;font:500 11px/1 var(--mono);letter-spacing:.2em;color:var(--ink-2)}
.cont .num{display:inline-block;overflow:hidden;height:1.25em;line-height:1.25em;color:var(--ink);font-weight:600}
.cont .num b{display:block;font-weight:600}
.cont .num b.rola{animation:rola 520ms var(--snappy)}
@keyframes rola{from{opacity:0;transform:translateY(80%)}to{opacity:1;transform:none}}
.prog{margin:14px 18px 0;height:4px;border-radius:4px;background:var(--line);position:relative;overflow:hidden;flex:none}
.prog i{position:absolute;inset:0;border-radius:4px;background:var(--ink);transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform 760ms var(--soft);overflow:hidden}
.prog i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-100%)}
.prog.avanca i::after{animation:prog-brilho 900ms var(--soft)}
@keyframes prog-brilho{to{transform:translateX(100%)}}

.palco{position:relative;flex:1;min-height:0;margin-top:4px}
.slide{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:24px 20px 34px;visibility:hidden;opacity:0;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 26px),transparent);mask-image:linear-gradient(#000 calc(100% - 26px),transparent);scrollbar-width:none}
.slide::-webkit-scrollbar{display:none}
.slide.ativo{visibility:visible;opacity:1}
@keyframes s-entra-d{from{opacity:0;transform:translateX(52px)}to{opacity:1;transform:none}}
@keyframes s-entra-e{from{opacity:0;transform:translateX(-52px)}to{opacity:1;transform:none}}
@keyframes s-sai-e{to{opacity:0;transform:translateX(-52px)}}
@keyframes s-sai-d{to{opacity:0;transform:translateX(52px)}}
.slide.entra-d{animation:s-entra-d 600ms var(--soft) both}
.slide.entra-e{animation:s-entra-e 600ms var(--soft) both}
.slide.sai-e{visibility:visible;animation:s-sai-e 260ms cubic-bezier(.4,0,1,1) both}
.slide.sai-d{visibility:visible;animation:s-sai-d 260ms cubic-bezier(.4,0,1,1) both}
@keyframes stg{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.slide.ativo .stg{animation:stg 640ms var(--snappy) backwards;animation-delay:calc(var(--k,0) * 55ms + var(--d0,140ms))}

.rot{font:500 10.5px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-2);margin-bottom:14px}
.q{font:300 27px/1.17 var(--sora);letter-spacing:-.012em;outline:none}
.q .n{font-weight:600;overflow-wrap:anywhere}
.aj{font:400 12.5px/1.55 var(--sora);color:var(--ink-2);margin-top:12px;max-width:34ch}
.lista{display:flex;flex-direction:column;gap:8px;margin-top:22px}
.err{font:500 12px/1.45 var(--sora);color:#B3141F;margin-top:14px;min-height:0}
.err:empty{display:none}
.err::before{content:"!";display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:#B3141F;color:#fff;font:600 10px var(--mono);margin-right:8px;vertical-align:1px}
.err.vem{animation:stg 420ms var(--snappy)}
@keyframes treme{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.treme{animation:treme 460ms cubic-bezier(.36,.07,.19,.97)!important}

/* opções: mesma anatomia dos botões (círculo + texto + estado) */
.opcao{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:7px 18px 7px 8px;border-radius:24px;background:var(--white);color:var(--ink);
  box-shadow:0 0 0 1px var(--line) inset;text-align:left;overflow:hidden;isolation:isolate;
  transition:transform 375ms var(--snappy),color 260ms var(--soft),box-shadow 260ms var(--soft)}
.opcao::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ink);transform:translateY(101%);transition:transform 420ms var(--soft)}
.opcao .ix{flex:none;position:relative;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;transition:background 260ms var(--soft),color 260ms var(--soft)}
.opcao .ix .l{font:500 12px var(--mono);letter-spacing:.04em;transition:opacity 180ms,transform 360ms var(--snappy)}
.opcao .ix svg{position:absolute;width:20px;height:20px}
.opcao .ix svg path{stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset 220ms ease 0ms}
.opcao .t{flex:1;min-width:0;font:600 13.5px/1.3 var(--sora);letter-spacing:.01em}
.opcao .t small{display:block;font:400 11.5px/1.4 var(--sora);color:var(--ink-2);margin-top:3px;letter-spacing:0;transition:color 260ms var(--soft)}
.opcao:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.opcao:hover{box-shadow:0 0 0 1.5px var(--ink) inset}}
.opcao[aria-pressed=true]{color:#fff;box-shadow:0 0 0 1.5px var(--ink) inset,0 16px 30px -18px rgba(10,10,10,.7)}
.opcao[aria-pressed=true]::before{transform:none}
.opcao[aria-pressed=true] .ix{background:#fff;color:var(--ink);animation:pop 460ms var(--snappy)}
.opcao[aria-pressed=true] .ix .l{opacity:0;transform:scale(.3) rotate(-120deg)}
.opcao[aria-pressed=true] .ix svg path{stroke-dashoffset:0;transition:stroke-dashoffset 360ms var(--soft) 120ms}
.opcao[aria-pressed=true] .t small{color:rgba(255,255,255,.72)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}

/* campos com rótulo flutuante */
.campos{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.fld{position:relative}
.fld input,.fld textarea{display:block;width:100%;height:66px;border:0;border-radius:20px;background:var(--white);color:var(--ink);font:500 17px/1.3 var(--sora);padding:27px 54px 8px 18px;
  box-shadow:0 0 0 1.5px var(--line) inset,0 0 0 0 rgba(10,10,10,0);transition:box-shadow 300ms var(--soft);-webkit-appearance:none;appearance:none}
.fld textarea{height:164px;resize:none;line-height:1.5;padding-top:32px;padding-right:18px}
.fld label{position:absolute;left:19px;top:23px;font:400 15.5px/1 var(--sora);color:var(--ink-2);pointer-events:none;transform-origin:0 0;transition:transform 380ms var(--snappy),color 240ms var(--soft)}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label,.fld textarea:focus+label,.fld textarea:not(:placeholder-shown)+label{transform:translateY(-14px) scale(.7);color:var(--ink)}
.fld input:focus,.fld textarea:focus{outline:none;box-shadow:0 0 0 2px var(--ink) inset,0 0 0 7px rgba(10,10,10,.08)}
.fld input::placeholder,.fld textarea::placeholder{color:transparent}
.fld .ok{position:absolute;right:14px;top:19px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;transform:scale(0) rotate(-90deg);transition:transform 420ms var(--snappy);pointer-events:none}
.fld .ok svg{width:16px;height:16px}
.fld .ok path{stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset 300ms ease 180ms}
.fld.valido .ok{transform:none}.fld.valido .ok path{stroke-dashoffset:0}
.fld.erro input,.fld.erro textarea{box-shadow:0 0 0 2px #B3141F inset,0 0 0 7px rgba(179,20,31,.08)}
.fld.erro label{color:#B3141F}
.fld .cta{position:absolute;right:16px;bottom:12px;font:400 10.5px var(--mono);letter-spacing:.08em;color:var(--ink-2)}

/* rodapé do painel: avançar = mesmo CTA primário */
.pe{flex:none;padding:10px 20px 0}
.pe .acao{min-height:62px}
.pe [hidden]{display:none!important}
.acao.p1.cont-btn{animation:none;background-image:none;box-shadow:0 18px 40px -16px rgba(10,10,10,.65)}
.acao.p1.cont-btn[aria-disabled=true]{opacity:.36;box-shadow:none}
.acao.p1.cont-btn[aria-disabled=true]{cursor:not-allowed;transform:none!important;color:var(--fg)!important}
.acao.p1.cont-btn[aria-disabled=true]::before{transform:translateY(101%)!important}
.acao.p1.cont-btn[aria-disabled=true] .seta{transform:none!important;background:var(--white)!important;color:var(--ink)!important}
.acao.p1.cont-btn.pronto{animation:pronto 900ms var(--soft)}
@keyframes pronto{0%{box-shadow:0 18px 40px -16px rgba(10,10,10,.65),0 0 0 0 rgba(10,10,10,.34)}100%{box-shadow:0 18px 40px -16px rgba(10,10,10,.65),0 0 0 18px rgba(10,10,10,0)}}
.acao.p3.fim{animation:entra-baixo 700ms var(--snappy) backwards}
.pe .nota{margin-top:12px;font:400 10px/1.5 var(--mono);letter-spacing:.04em;color:var(--ink-2);text-align:center}

/* confirmação */
.final{text-align:center}
.final .q,.final .aj{margin-left:auto;margin-right:auto}
.selo{position:relative;width:104px;height:104px;margin:14px auto 24px}
.selo svg{position:relative;width:100%;height:100%;overflow:visible}
.selo .anel{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:277;stroke-dashoffset:0}
.selo .miolo{fill:var(--ink);transform-box:fill-box;transform-origin:center}
.selo .tick{fill:none;stroke:#fff;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:0}
.selo .rip{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ink);opacity:0}
.final.ativo .anel{animation:desenha 1000ms var(--soft) 260ms backwards}
.final.ativo .miolo{animation:miolo 640ms var(--snappy) 760ms backwards}
.final.ativo .tick{animation:tick 520ms var(--soft) 1020ms backwards}
.final.ativo .rip{animation:rip 1500ms var(--soft) 900ms 2 backwards}
.final.ativo .rip+.rip{animation-delay:1250ms}
@keyframes desenha{from{stroke-dashoffset:277}}
@keyframes miolo{from{transform:scale(0)}}
@keyframes tick{from{stroke-dashoffset:22}}
@keyframes rip{0%{opacity:.8;transform:scale(.5)}100%{opacity:0;transform:scale(1.7)}}
.pronta{margin:22px auto 0;max-width:330px;text-align:left;border-radius:20px;background:var(--white);box-shadow:0 0 0 1px var(--line) inset;padding:14px 16px}
.pronta span{display:block;font:500 9.5px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-2);margin-bottom:10px}
.pronta pre{font:400 11.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.tag{margin-top:16px;font:400 10px/1.5 var(--mono);letter-spacing:.06em;color:var(--ink-2)}

@media (max-height:700px){.q{font-size:23px}.opcao{min-height:50px}.rot{margin-bottom:10px}.lista{margin-top:16px;gap:7px}.slide{padding-top:18px}.pe .acao{min-height:56px}.selo{width:84px;height:84px;margin:4px auto 16px}.fld input{height:62px}}
@media (max-width:370px){.q{font-size:24px}.opcao .t{font-size:13px}.pe .acao{padding-left:20px}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rise,.nome .l{opacity:1!important;transform:none!important;filter:none!important}
  .painel{clip-path:none!important}.painel:not(.aberto){display:none}
}

.capa{position:absolute;inset:0 0 auto 0;height:58%;background:var(--foto) 50% 0/cover no-repeat;transform-origin:50% 12%;animation:capa-in 1400ms var(--soft) backwards,respira 14s ease-in-out 1400ms infinite alternate}
.capa::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(247,246,243,0) 56%,rgba(247,246,243,.85) 86%,var(--paper) 100%)}
.conteudo{position:absolute;left:0;right:0;bottom:0;padding:0 20px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.conteudo .eyebrow{margin-bottom:0}
.conteudo .nome{margin-bottom:10px}
.conteudo .rodape{margin-top:6px}
@media (max-height:760px){.capa{height:52%}.acao.p1{min-height:58px}.acao.p2{min-height:68px}.acao{min-height:52px}.conteudo{gap:10px}.nome{font-size:20px}}
@media (max-width:370px){.acao{font-size:12px;letter-spacing:.05em;padding-left:18px}.acao.p1{font-size:13px}.acao.p2{padding:12px 12px 12px 14px;gap:10px;font-size:11.5px;letter-spacing:.05em}.acao.p3{padding-left:8px}.conteudo{padding-left:16px;padding-right:16px}}
.redes{display:flex;flex-wrap:wrap;justify-content:center;column-gap:8px}
.redes a{display:inline-flex;align-items:center;min-height:44px;padding:0 3px;color:var(--ink);font:500 11px/1 var(--sora);text-decoration:underline;text-underline-offset:3px;animation:rise 800ms var(--snappy) backwards;animation-delay:calc(960ms + var(--k,0) * 70ms);transition:transform 375ms var(--snappy),text-decoration-thickness 200ms}
.redes a:active{transform:scale(.92)}
.redes a:focus-visible{text-decoration-thickness:2px}
@media (hover:hover) and (pointer:fine){.redes a:hover{text-decoration-thickness:2px}}
@media (max-height:760px){.conteudo .rodape{margin-top:0}.capa{height:48%}}
@media (orientation:landscape) and (max-height:480px){
  .tela-base{height:100%;overflow-y:auto}
  .capa{position:relative;height:clamp(88px,34dvh,145px)}
  .conteudo{position:relative}
}
</style>
</head>
<body>
<main class="screen" data-estado-alvo>
  <div class="tela-base">
    <div class="capa" role="img" aria-label="Retrato de Rafael Valente"></div>
    <div class="conteudo">
      <p class="eyebrow rise" style="--i:2"><i>▲</i>Advanx IA</p>
      <h1 class="nome rise" style="--i:3">Rafael Valente</h1>
      <a class="acao p1 rise" style="--i:4" href="#implementar-ia" data-abre="ia"><span class="txt">Implementar IA</span><span class="seta" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></a>

function foco(p,s){
  var inp=s.querySelector('.fld input,.fld textarea');
  try{(inp||s.querySelector('.q')).focus({preventScroll:true})}catch(e){}
}
function topo(p,anim){
  var n=p.__n, i=p.__i, fim=i>=n, idx=fim?n:i+1;
  var novo=pad(idx); if(p.__num.textContent!==novo){p.__num.textContent=novo; if(anim&&!reduz.matches){p.__num.classList.remove('rola');reflow(p.__num);p.__num.classList.add('rola')}}
  p.__prog.style.setProperty('--p',fim?1:idx/n); p.__prog.setAttribute('aria-valuenow',idx);
  if(anim&&!reduz.matches){p.__prog.classList.remove('avanca');reflow(p.__prog);p.__prog.classList.add('avanca')}
  p.__vl.textContent=fim?'Fechar':'Voltar';
  var ps=passoDe(p,i);
  p.__btn.hidden=fim; p.__fim.hidden=!fim;
  p.__btn.querySelector('.txt').textContent=(ps&&ps.botao)||'Continuar';
  p.__nota.textContent=fim?'':((ps&&ps.nota)||p.__f.nota);
  if(fim){p.__fim.classList.remove('fim');reflow(p.__fim);p.__fim.classList.add('fim')}
}
function vai(p,novo,dir,imediato){
  var slides=p.__slides, velho=slides[p.__i], s=slides[novo];
  prepara(p,novo); p.__i=novo; p.__pronto=false; topo(p,!imediato); atualizaBotao(p);
  if(imediato||reduz.matches){
    slides.forEach(function(x){x.classList.remove('ativo','sai-e','sai-d','entra-e','entra-d');x.setAttribute('aria-hidden','true')});
    s.style.setProperty('--d0',imediato?'560ms':'140ms'); s.classList.add('ativo'); s.setAttribute('aria-hidden','false'); s.scrollTop=0;
    setTimeout(function(){foco(p,s)},imediato?820:30); return;
  }
  p.__busy=true; vibra(5);
  velho.classList.add(dir>0?'sai-e':'sai-d');
  setTimeout(function(){
    s.style.setProperty('--d0','140ms'); s.scrollTop=0; s.setAttribute('aria-hidden','false');
    s.classList.add('ativo',dir>0?'entra-d':'entra-e');
  },130);
  setTimeout(function(){velho.classList.remove('ativo','sai-e','sai-d');velho.setAttribute('aria-hidden','true')},270);
  setTimeout(function(){s.classList.remove('entra-d','entra-e');p.__busy=false;foco(p,s)},740);
}

/* ---------- abrir / fechar ---------- */
function abrir(id,origem){
  var p=document.getElementById('p-'+id); if(!p) return;
  var rt=tela.getBoundingClientRect(), br=origem.getBoundingClientRect();
  var ox=br.left+br.width/2-rt.left, oy=br.top+br.height/2-rt.top;
  p.style.setProperty('--ox',ox+'px'); p.style.setProperty('--oy',oy+'px');
  p.style.setProperty('--r',Math.ceil(Math.hypot(Math.max(ox,rt.width-ox),Math.max(oy,rt.height-oy)))+4+'px');
  reset(p); p.__origem=origem; p.__busy=false;
  p.__prog.style.setProperty('--p',0);
  tela.classList.add('em-painel'); base.setAttribute('inert','');
  reflow(p); p.classList.add('aberto');
  vai(p,0,1,true);
  p.__prog.style.setProperty('--p',0); reflow(p.__prog); setTimeout(function(){p.__prog.style.setProperty('--p',1/p.__n);p.__prog.classList.add('avanca')},reduz.matches?0:560);
}
function reset(p){
  p.__r={}; p.__i=0; p.__pronto=false;
  p.__slides.forEach(function(s){s.classList.remove('ativo','sai-e','sai-d','entra-e','entra-d');
    [].forEach.call(s.querySelectorAll('.opcao'),function(b){b.setAttribute('aria-pressed','false')});
    [].forEach.call(s.querySelectorAll('.fld'),function(f){var i=f.querySelector('input,textarea');i.value='';f.classList.remove('valido','erro')});
    var e=s.querySelector('.err'); if(e) e.textContent=''});
}
function fechar(p){
  if(!p||!p.classList.contains('aberto')) return;
  p.classList.remove('aberto'); tela.classList.remove('em-painel'); base.removeAttribute('inert');
  var o=p.__origem; setTimeout(function(){if(o)o.focus({preventScroll:true})},reduz.matches?0:120);
  setTimeout(function(){reset(p)},700);
}
window.__fecharPaineis=function(){[].forEach.call(document.querySelectorAll('.painel.aberto'),fechar)};

/* Abre o WhatsApp depois de gravar, ou em 1,5 s com o Supabase lento ou fora: o lead nunca fica parado aqui.
   Mínimo de 0,9 s para a tela de confirmação aparecer. O botão da tela final continua como reserva. */
function redireciona(p,gravou){
  var foi=false, t0=Date.now();
  function vaiWa(){if(foi||!p.classList.contains('aberto')) return; foi=true;
    setTimeout(function(){location.href=p.__fim.getAttribute('href')},Math.max(0,900-(Date.now()-t0)))}
  setTimeout(vaiWa,1500);
  Promise.resolve(gravou).then(vaiWa,vaiWa);
}
function ligaEventos(p){
  p.querySelector('.voltar').addEventListener('click',function(){
    if(p.__busy) return; if(p.__i===0||p.__i>=p.__n) fechar(p); else {guarda(p,p.__i);vai(p,p.__i-1,-1)}});
  p.__btn.addEventListener('click',function(){
    if(p.__busy) return; var er=checa(p,p.__i);
    if(er){mostraErro(p,er);return}
    guarda(p,p.__i);
    var gravou=p.__i===p.__n-1?Envio.confirma(p.__id,p.__r):null; /* por trás: a tela final abre na hora */
    vai(p,p.__i+1,1);
    if(gravou&&p.__f.redireciona) redireciona(p,gravou);
  });
  p.addEventListener('click',function(e){
    var b=e.target.closest('.opcao'); if(!b) return;
    var s=b.closest('.slide'), ps=passoDe(p,+s.getAttribute('data-i'));
    limpaErro(p);
    if(ps.varios) b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');
    else [].forEach.call(s.querySelectorAll('.opcao'),function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});
    vibra(8); atualizaBotao(p);
  });
  p.addEventListener('input',function(e){
    var inp=e.target; var f=inp.closest&&inp.closest('.fld'); if(!f) return;
    if(f.getAttribute('data-t')==='tel') inp.value=mascara(inp.value);
    limpaErro(p); sinc(f); atualizaBotao(p);
  });
  p.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target.matches&&e.target.matches('input')){e.preventDefault();
      var inputs=[].slice.call(p.__slides[p.__i].querySelectorAll('input')), k=inputs.indexOf(e.target);
      if(k>-1&&k<inputs.length-1&&!checa(p,p.__i)===false&&!VAL[e.target.parentNode.getAttribute('data-t')](e.target.value)){mostraErro(p,{el:e.target.parentNode,inp:e.target,msg:ERR[e.target.parentNode.getAttribute('data-t')]});return}
      if(k>-1&&k<inputs.length-1) inputs[k+1].focus({preventScroll:true}); else p.__btn.click()}
  });
}

/* ---------- envio ao receptor (T37) ----------
   Mesmo padrão do formulário do blog (unified-lead-form.js): o pacote é guardado neste navegador ANTES do envio;
   POST text/plain (sem pré-checagem CORS) com keepalive; com o recibo, só GET até o servidor confirmar o CRM.
   Mesmo conteúdo = mesmo submission_id (o servidor deduplica). 409/422 = o servidor nunca aceitará: sai da fila.
   Nada aqui segura a tela: a tela final e o WhatsApp abrem na hora, com ou sem rede. Nenhum dado pessoal no console. */
var Envio=(function(){
  var URL_RX='https://form.advanx.com.br/api/blog-leads', CHAVE='advanx_bio_pendentes_v1', IDS='advanx_bio_ids_v1';
  var IDADE=7*24*3600*1000, REUSO=24*3600*1000, ESPERAS=[3000,15000,60000], emVoo={};
  var ORIGEM={ia:'bio-implementar-ia',funil:'bio-funil'};
  function le(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return []}}
  function grava(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function fila(f){grava(CHAVE,f(le(CHAVE)).slice(-5))}
  function tira(id){fila(function(l){return l.filter(function(j){return j.crm.submission_id!==id})})}
  function salva(job){fila(function(l){return l.map(function(j){return j.crm.submission_id===job.crm.submission_id?job:j})})}
  function novoId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(16)+'-'+Math.random().toString(16).slice(2)+Math.random().toString(16).slice(2)}
  function utm(){var q={},u;try{u=new URLSearchParams(location.search)}catch(e){return q}
    ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid'].forEach(function(k){var v=(u.get(k)||'').trim().slice(0,300);if(v)q[k]=v});return q}
  function corta(v,n){return String(v==null?'':v).trim().slice(0,n)}
  function monta(fluxo,r){
    var tel=digitos(r.tel||''), nome=corta(r.nome,120), origem=ORIGEM[fluxo], u=utm(), resp, resumo;
    if(fluxo==='ia'){
      resp={problema:corta(r.problema,500),investimento_mensal:corta(r.invest,200),formato:corta(r.formato,200),quando_comecar:corta(r.quando,200)};
      resumo='Bio Rafael · Implementar IA | Problema: '+resp.problema+' | Investimento por mês: '+resp.investimento_mensal+' | Formato: '+resp.formato+' | Quando começar: '+resp.quando_comecar;
    }else{
      resp={dificuldades:corta((r.dific||[]).join(', '),600),area_negocio:corta(r.area,200),orcamento_mensal:corta(r.orc,200),quando_comecar:corta(r.prazo,200)};
      resumo='Bio Rafael · Funil de aquisição | Dificuldades: '+resp.dificuldades+' | Área: '+resp.area_negocio+' | Orçamento por mês: '+resp.orcamento_mensal+' | Quando começar: '+resp.quando_comecar;
    }
    var email=fluxo==='ia'?corta(r.email,180).toLowerCase():'';
    var crm={nome:nome,telefone:'55'+tel,origem_lead:origem,pagina_url:location.origin+location.pathname};
    if(email) crm.email=email;
    Object.keys(resp).forEach(function(k){crm[k]=resp[k]}); Object.keys(u).forEach(function(k){crm[k]=u[k]});
    var sb={nome:nome,telefone:tel,origem:origem,campanha:u.utm_campaign||'bio',conjunto:u.utm_medium||'organico',
      anuncio:u.utm_content||ORIGEM[fluxo],posicionamento:u.utm_term||crm.pagina_url,utm_medium:u.utm_medium||null,
      comentario:(resumo+(u.fbclid?' | fbclid: '+u.fbclid:'')+(u.gclid?' | gclid: '+u.gclid:'')).slice(0,3000)};
    if(email) sb.email=email;
    return {crm:crm,supabase:sb};
  }
  /* mesmo conteúdo em 24 h = mesmo id (toque duplo, voltar e confirmar de novo, recarregar) */
  function idPara(job){
    var chave=JSON.stringify(job), agora=Date.now();
    var ids=le(IDS).filter(function(x){return agora-x.t<REUSO});
    var achou=ids.filter(function(x){return x.k===chave})[0];
    if(!achou){achou={k:chave,id:novoId(),t:agora};ids.push(achou);grava(IDS,ids.slice(-10))}
    return achou.id;
  }
  function manda(job){
    var id=job.crm.submission_id, rec=job.receipt;
    return fetch(URL_RX+(rec?'/'+encodeURIComponent(id):''),{method:rec?'GET':'POST',keepalive:true,credentials:'omit',
      headers:rec?undefined:{'Content-Type':'text/plain;charset=UTF-8'},
      body:rec?undefined:JSON.stringify({crm:job.crm,supabase:job.supabase})
    }).then(function(r){
      if(r.status===409||r.status===422){tira(id);return {fim:true}}
      if(!r.ok) throw new Error('rx '+r.status);
      return r.json();
    }).then(function(r){
      if(r.fim) return;
      if(r.submission_id!==id||r.accepted!==true||typeof r.receipt!=='string'||(rec&&rec!==r.receipt)) throw new Error('recibo');
      job.receipt=r.receipt; salva(job);
      var c=r.destinations&&r.destinations.crm;
      if(c!=='delivered'&&c!=='failed') throw new Error('crm pendente'); /* o servidor ainda confere; seguimos consultando */
      tira(id);
    });
  }
  function tenta(job,k){
    var id=job.crm.submission_id; if(emVoo[id]) return; emVoo[id]=1;
    manda(job).then(function(){delete emVoo[id]},function(){delete emVoo[id];
      if(k<ESPERAS.length) setTimeout(function(){var j=le(CHAVE).filter(function(x){return x.crm.submission_id===id})[0]; if(j) tenta(j,k+1)},ESPERAS[k]);
    });
  }
  /* Implementar IA → Supabase "Advanx gestão" (edge receber-lead), direto, sem CRM (pedido do Rafael, 26/11).
     O pacote fica na fila deste navegador ANTES do envio e só sai com 200 ok. 400 = o servidor nunca aceitará: sai.
     Outra falha (rede, 403, 5xx) fica na fila com o código do erro e volta a tentar ao reabrir a bio ou voltar a rede.
     atalho: o erro fica só neste navegador; se a pessoa não voltar, o lead chega só pela conversa no WhatsApp oficial. */
  var URL_SB='https://rbhdpchaawbclzjcwkoe.supabase.co/functions/v1/receber-lead', CHAVE_SB='advanx_bio_supa_pendentes_v1';
  function filaSb(f){grava(CHAVE_SB,f(le(CHAVE_SB)).slice(-5))}
  function montaSupa(r){
    var u=utm(), c={formulario:'bio',nome:corta(r.nome,120),telefone:'55'+digitos(r.tel||''),instagram:instaUser(r.insta)};
    Object.keys(u).forEach(function(k){c[k]=u[k]});
    c.submission_id=idPara({sb:c});
    c.respostas={fluxo:'implementar-ia',pagina:location.origin+location.pathname,referrer:corta(document.referrer,300),enviado_em:new Date().toISOString()};
    return c;
  }
  function mandaSupa(c){
    var id=c.submission_id;
    return fetch(URL_SB,{method:'POST',keepalive:true,credentials:'omit',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(c,function(k,v){return this===c&&(k==='created'||k==='erro'||k==='erro_em')?undefined:v})})
      .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
        if(r.ok&&j.ok===true){filaSb(function(l){return l.filter(function(x){return x.submission_id!==id})});return true}
        if(r.status===400) filaSb(function(l){return l.filter(function(x){return x.submission_id!==id})});
        throw new Error('sb '+r.status+(j.erro?' '+j.erro:''));
      })})
      .catch(function(e){
        var cod=String(e&&e.message||'rede').slice(0,60);
        filaSb(function(l){return l.map(function(x){if(x.submission_id===id){x.erro=cod;x.erro_em=Date.now()}return x})});
        try{console.warn('[bio] gravação no Supabase falhou: '+cod)}catch(_){} /* só o código, sem dado pessoal */
        return false;
      });
  }
  function supa(r){
    var c=montaSupa(r), id=c.submission_id;
    var velho=le(CHAVE_SB).filter(function(x){return x.submission_id===id})[0];
    if(velho) c=velho; else {c.created=Date.now(); filaSb(function(l){return l.concat([c])})}
    return mandaSupa(c);
  }
  function retomaSupa(){
    var agora=Date.now();
    le(CHAVE_SB).forEach(function(c){if(!c||!c.submission_id) return;
      if(c.created&&agora-c.created>IDADE){filaSb(function(l){return l.filter(function(x){return x.submission_id!==c.submission_id})});return}
      mandaSupa(c)});
  }
  function confirma(fluxo,r){
    try{
      if(fluxo==='ia') return supa(r);
      if(!ORIGEM[fluxo]) return;
      var job=monta(fluxo,r), id=idPara(job);
      job.crm.submission_id=id; job.supabase.submission_id=id;
      var velho=le(CHAVE).filter(function(j){return j.crm.submission_id===id})[0];
      if(velho) job=velho; else {job.created=Date.now(); fila(function(l){return l.concat([job])})}
      tenta(job,0);
    }catch(e){return Promise.resolve(false)} /* falha aqui nunca impede a tela final nem o WhatsApp */
  }
  function retoma(){
    var agora=Date.now();
    le(CHAVE).forEach(function(j){if(!j||!j.crm||(j.created&&agora-j.created>IDADE)){if(j&&j.crm)tira(j.crm.submission_id);return} tenta(j,0)});
  }
  window.addEventListener('online',function(){retoma();retomaSupa()});
  return {confirma:confirma,retoma:function(){retoma();retomaSupa()}};
})();

Object.keys(FLUXOS).forEach(function(id){montaPainel(id,FLUXOS[id])});
